function playSound(kind){
 if(!soundEnabled||document.hidden)return;
 try{
 const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
 if(!audioContext){audioContext=new Audio();master=audioContext.createGain();master.gain.value=.16;master.connect(audioContext.destination);}
 if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});

 const tunes={step:[[660,0,.09],[880,.055,.12]],wall:[[180,0,.13],[115,.08,.2],[230,.18,.13]],hint:[[784,0,.18],[988,.13,.18],[1175,.26,.28]],start:[[523,0,.14],[659,.12,.16],[784,.24,.23]],win:[[523,0,.2],[659,.15,.2],[784,.3,.2],[1047,.5,.45],[784,.55,.4],[1319,.8,.5]]};
 for(const[freq,delay,length]of tunes[kind]||tunes.step){const o=audioContext.createOscillator(),g=audioContext.createGain(),t=now+delay;o.type=kind==='wall'?'triangle':'sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+length);o.connect(g);g.connect(master);o.start(t);o.stop(t+length+.03);o.onended=()=>{o.disconnect();g.disconnect();};}

}
function reducedMotion(){return window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;}
function sparkAt(selector){if(reducedMotion())return;const target=document.querySelector(selector);if(!target)return;const rect=target.getBoundingClientRect();const layer=$('fx');while(layer.childElementCount>35)layer.firstChild.remove();for(let i=0;i<6;i++){const el=document.createElement('span');el.className='spark';el.textContent=i%2?'✦':'♡';el.style.cssText=`left:${rect.left+rect.width/2}px;top:${rect.top+rect.height/2}px;color:${i%2?'#dfae36':'#df79a5'};--dx:${Math.cos(i*Math.PI/3)*35}px;--dy:${Math.sin(i*Math.PI/3)*30-12}px`;layer.appendChild(el);setTimeout(()=>el.remove(),850);}}

function render(){const scene=levels[level];const palette=palettes[level];['--scene-bg','--scene-wall','--scene-border'].forEach((v,i)=>document.body.style.setProperty(v,palette[i]));$('total').textContent=levels.length;$('world').value=String(Math.floor(level/5));$('scene').textContent=`${scene.icon||'🌷'}　🌸　${scene.food}　${scene.icon||'🌷'}`;$('legend').textContent=`🌸 小女孩出发　·　沿浅色小路走　·　${scene.food} 找到点心`;document.querySelector('.reward').innerHTML='<img class="girl-reward" src="'+girlImage+'" alt="小女孩"><span>'+scene.food+'</span>';document.querySelector('.levels').innerHTML=levels.map((l,i)=>Math.floor(i/5)!==Math.floor(level/5)?'':`<button class="level ${i===level?'active':''}" aria-label="第${i+1}关${completed.has(i)?'，已完成':''}" ${i===level?'aria-current="step"':''} data-level="${i}">${completed.has(i)?'★':i+1}</button>`).join('');$('title').textContent=`${level+1}. ${levels[level].name}`;$('count').textContent=completed.size;let html='';for(let y=0;y<7;y++)for(let x=0;x<7;x++){const wall=!valid(x,y),player=x===pos[0]&&y===pos[1],goal=x===5&&y===5,isHint=hint===key(x,y);html+=wall?`<div class="cell wall" aria-hidden="true">${(x+y*3)%6===0?(scene.icon||'🌷'):''}</div>`:`<button class="cell path ${player?'player':isHint?'hint':visited.has(key(x,y))&&!goal?'trail':''}" data-x="${x}" data-y="${y}" aria-label="${player?'小女孩':goal?'终点点心':isHint?'提示，走这里':'小路'}，第${y}行第${x}列">${player?'<img class="girl-sprite" src="'+girlImage+'" alt="" draggable="false">':goal?'<span class="goal-icon">'+levels[level].food+'</span>':isHint?'⭐':''}</button>`;}$('board').innerHTML=html;}

function jumpTo(tx,ty){if(jumping||won||$('win').open||(tx===pos[0]&&ty===pos[1]))return false;const dx=Math.sign(tx-pos[0]),dy=Math.sign(ty-pos[1]);if(dx&&dy)return false;const steps=[];for(let x=pos[0]+dx,y=pos[1]+dy;x!==tx+dx||y!==ty+dy;x+=dx,y+=dy){if(!valid(x,y)){zap();return false;}steps.push([dx,dy]);}jumping=true;const hop=()=>{if(!steps.length||won){jumping=false;jumpTimer=null;return;}move(...steps.shift());if(steps.length&&!won)jumpTimer=setTimeout(hop,reducedMotion()?60:130);else{jumping=false;jumpTimer=null;}};hop();return true;}

$('world').innerHTML=worlds.map((w,i)=>`<option value="${i}">${w} · ${i*5+1}–${i*5+5} 关</option>`).join('');$('world').onchange=()=>start(Number($('world').value)*5);
